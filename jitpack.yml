# JitPack builds each tag into com.github.Brendan-Black.Version:free:<tag> and com.github.Brendan-Black.Version:Black:<tag>.
# Gradle runs on JDK 21 here and fetches the JDK 25 toolchain (settings.gradle.kts); the jars target Java 17.
jdk:
  - openjdk21
install:
  - ./gradlew publishToMavenLocal -x runTests
